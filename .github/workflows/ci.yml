name: CI

# The repo shipped a frontend that could not be built (Tailwind v4 installed
# against a v3 config), a requirements.txt missing a package a script imports,
# and a test file pytest never collected. None of that survives a run of these
# two jobs -- which is the point.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # tests/test_vector_store.py builds a real index, which pulls
      # sentence-transformers/all-MiniLM-L6-v2 (~90 MB) from the Hub. Caching it
      # keeps that download off every run.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      - name: Lint
        run: ruff check .

      - name: Tests
        # No live Gemini call happens in the suite -- the wrapper tests pass an
        # explicit mock key and the API tests use a stub LLM -- but
        # ChatGoogleGenerativeAI wants *a* key at construction, so give it one
        # that is obviously not real.
        env:
          GOOGLE_API_KEY: not-a-real-key-nothing-here-calls-gemini
        run: pytest -q

  frontend:
    name: frontend (tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npx vite build
