name: CI

# The repo shipped a frontend that could not be built (Tailwind v4 installed
# against a v3 config), a requirements.txt missing a package a script imports,
# and a test file pytest never collected. None of that survives a run of these
# two jobs -- which is the point.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # tests/test_vector_store.py builds a real index, which pulls
      # sentence-transformers/all-MiniLM-L6-v2 (~90 MB) from the Hub. Caching it
      # keeps that download off every run.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      - name: Lint
        run: ruff check .

      - name: Tests
        # No live Gemini call happens in the suite -- the wrapper tests pass an
        # explicit mock key and the API tests use a stub LLM -- but
        # ChatGoogleGenerativeAI wants *a* key at construction, so give it one
        # that is obviously not real.
        env:
          GOOGLE_API_KEY: not-a-real-key-nothing-here-calls-gemini
        run: pytest -q

  # The two jobs above prove the code runs. Neither proves that *retrieval*
  # works: they never fetch a corpus, never build an index, and every retrieval
  # test stubs the vector store. This job is the only one that touches real
  # embeddings over real data, so it is also the only one that would notice an
  # upstream corpus disappearing or a chunking change tanking recall.
  #
  # Non-blocking on purpose. Recall over a 3-page lore corpus is not a number
  # worth failing a build on yet -- promote it to a gate by dropping
  # continue-on-error and passing --min-hit-rate once the corpus is complete.
  retrieval-eval:
    name: retrieval eval (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      # The corpora are third-party clones, not vendored and not submodules.
      # If this step fails the eval below reports every dialogue case as a miss,
      # which is exactly the signal wanted -- an upstream repo going away is
      # otherwise invisible until someone clones the project fresh.
      - name: Fetch corpora
        run: python scripts/fetch_corpora.py

      - name: Build the index
        run: python scripts/build_index.py --require-dialogue

      - name: Run the retrieval eval
        run: |
          python scripts/run_retrieval_eval.py --json eval-results.json | tee report.txt
          {
            echo '## Retrieval eval'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-eval
          path: eval-results.json
          if-no-files-found: warn

  frontend:
    name: frontend (tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npx vite build
